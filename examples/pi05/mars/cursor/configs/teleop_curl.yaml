# Teleop with a clockwise curl force field on the cursor (curl_teleop.py).
# The cursor gets inertia (velocity_tau) so the field has something to push:
# at steady state b = 10/s with tau = 0.1 s turns your command 45 degrees
# clockwise and slows it by 1/sqrt(2); reaches start straight and curve as the
# cursor speeds up. A simulated operator still hits every target, but takes
# twice as long (2.3 s against 1.2 s); at b = 20/s it hits only 43%.
extends: base.yaml
control:
  mode: teleop
task:
  velocity_tau: 0.1
  curl: 10.0
