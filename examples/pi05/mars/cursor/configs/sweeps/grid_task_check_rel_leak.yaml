# Round 4b, the goal-leak check of the rigid recipe at 300 demonstrations: every obstacle the modules were trained on
# is placed relative to the reach from the start to the goal, so its position may tell an image module where the goal
# is. Here each cell's obstacle is placed on a decoy reach instead (`decoy: true`: from the start to a random non-goal
# target), the rest of grid_task_check_rel_rigid unchanged (no fine-tuned row). Reading: a module that infers the goal
# from the obstacle sends the goal-hidden policy (policy_task_rel_rigid) to the decoy, so its wrong-target share is
# well above the parametric module's (policy_task); with the goal given, hits on decoy layouts (oracle_task_rel_rigid
# against oracle_task) say whether the module still avoids an obstacle off its reach. Report:
# report_grid_image.py --check <run> (the gate's hidden wrong and ref hidden wrong columns).
#   python run_sweep.py --sweep grid_task_check_rel_leak --out grid_task_check_rel_leak
name: grid_task_check_rel_leak
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_task_rel_rigid: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_rigid, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_rigid}}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_task_rel_rigid: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_rigid, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_rigid}}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024], decoy: true}, adapter: task_disc_large_n300_s0_with_gain025y}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30], decoy: true}, adapter: task_ring_goal_n300_s0_with_rot60}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_rel_rigid
against: [oracle_task]
seed: 820
