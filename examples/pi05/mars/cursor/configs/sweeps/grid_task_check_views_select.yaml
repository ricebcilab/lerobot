# Stage A of the two-view image modules, recipe choice (T2 and T4, one disc and one ring), at 300 demonstrations: the base
# recipe against three single changes (span1, nomask, noaffine), each a module per task trained on two views per frame.
# Oracle: the expert_chunk agent in teleop, readout off; oracle_task the parametric module, oracle_ft the fine-tuned policy.
# Rule, on mean hits over the contexts of oracle_task_views_<recipe>: a change is adopted when its mean beats the base's
# by more than 3 points (an exact +3 is not adopted). Report: report_grid_image.py --select <run>.
#   python run_sweep.py --sweep grid_task_check_views_select
name: grid_task_check_views_select
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_ft: {mode: teleop, readout: off, model: {T2: flow_goaldrop_disc_large_ft_n300_s0, T4: flow_goaldrop_ring_goal_ft_n300_s0}}
  oracle_task_views_base: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_views_base, T4: image/task_ring_goal_n300_s0_with_rot60_views_base}}}
  oracle_task_views_span1: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_views_span1, T4: image/task_ring_goal_n300_s0_with_rot60_views_span1}}}
  oracle_task_views_nomask: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_views_nomask, T4: image/task_ring_goal_n300_s0_with_rot60_views_nomask}}}
  oracle_task_views_noaffine: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_views_noaffine, T4: image/task_ring_goal_n300_s0_with_rot60_views_noaffine}}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_views_base
against: [oracle_task, oracle_ft]
seed: 821
