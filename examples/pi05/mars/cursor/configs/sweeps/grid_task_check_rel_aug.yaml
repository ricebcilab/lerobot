# Round 4 gate of the relative image modules, augmentation (T2 and T4), at 300 demonstrations: three augmented variants of
# the relative module (jit: state jitter with recovery labels; rigid: rigid motions of the scene; both), one module per
# task, against the unaugmented module (oracle_task_rel, rel300), the parametric module (oracle_task, the reference) and
# the fine-tuned policy (oracle_ft), on the layouts of the round-3 scan. Oracle: the expert_chunk agent in teleop, readout
# off; policy: the goal-hidden policy.
# Rule, on mean hits over the contexts of oracle_task_rel_<arm>: the adopted arm is the one with the highest mean among
# those beating oracle_task_rel's mean by more than 3 points (an exact +3 is not adopted; a tie goes to the arm with fewer
# changes: jit, then rigid, then both); none clears it, the recipe stays rel300. Level and in band against oracle_task
# as before; a goal-hidden policy_task_rel_<arm> that hits more than 10 points above policy_task is flagged.
# Report: report_grid_image.py --check grid_task_check_rel_aug, and
# report_grid_image.py --select grid_task_check_rel_aug --prefix rel --base rel.
#   python run_sweep.py --sweep grid_task_check_rel_aug
name: grid_task_check_rel_aug
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_ft: {mode: teleop, readout: off, model: {T2: flow_goaldrop_disc_large_ft_n300_s0, T4: flow_goaldrop_ring_goal_ft_n300_s0}}
  oracle_task_rel: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel}}}
  oracle_task_rel_jit: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_jit, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_jit}}}
  oracle_task_rel_rigid: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_rigid, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_rigid}}}
  oracle_task_rel_both: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_both, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_both}}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_task_rel: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel}}}
  policy_task_rel_jit: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_jit, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_jit}}}
  policy_task_rel_rigid: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_rigid, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_rigid}}}
  policy_task_rel_both: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel_both, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel_both}}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_rel_both
against: [oracle_task, oracle_ft]
seed: 820
