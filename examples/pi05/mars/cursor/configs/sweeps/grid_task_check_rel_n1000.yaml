# Round 4 stage 2, the demonstration scan of the relative recipe with rigid copies (T2 and T4), count 1000: the module trained
# on 1000 demonstrations plus 9 rigid copies each (scenes held near 10,000), against the parametric module (oracle_task, the
# reference) and the fine-tuned policy (oracle_ft). Rule per context: level = hits at least oracle_task's minus 3 points and
# collisions at most oracle_task's plus 3 points. Report: report_grid_image.py --scan <run300> <run1000> <run3000> --prefix rel.
#   python run_sweep.py --sweep grid_task_check_rel_n1000
name: grid_task_check_rel_n1000
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_ft: {mode: teleop, readout: off, model: {T2: flow_goaldrop_disc_large_ft_n300_s0, T4: flow_goaldrop_ring_goal_ft_n300_s0}}
  oracle_task_rel_n1000: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n1000_s0_with_gain025y_vlm_image_rel_rigid, T4: image/task_ring_goal_n1000_s0_with_rot60_vlm_image_rel_rigid}}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_task_rel_n1000: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n1000_s0_with_gain025y_vlm_image_rel_rigid, T4: image/task_ring_goal_n1000_s0_with_rot60_vlm_image_rel_rigid}}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_rel_n1000
against: [oracle_task, oracle_ft]
seed: 820
