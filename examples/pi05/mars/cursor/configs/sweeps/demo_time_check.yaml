# The demonstration-time curve's gate: does fine-tuning the frozen policy on a task's demonstrations give a
# policy that does the task, under the grid's controller? For each obstacle task, each policy alone with the goal
# given (oracle_*: the expert_chunk agent, readout off) and hidden (policy_*): the frozen policy, the frozen policy
# through the grid's task module (300 demonstrations), the policy retrained from scratch on 20 000 (the grid's
# retrained_mars_user), and the policy fine-tuned on 5 and on 180 min of demonstrations (train_policy.py --init
# flow_goaldrop --demo_seconds 300 / 10800, its training length picked by --eval_steps).
# Go: fine-tuned on 180 min, alone with the goal given, not far below the policy retrained on 20 000.
#   python run_sweep.py --sweep demo_time_check          # a few minutes
name: demo_time_check
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_retrained: {mode: teleop, readout: off, model: &retrained {T2: flow_goaldrop_disc_large, T3: flow_goaldrop_wall_gap,
                                                                   T4: flow_goaldrop_ring_goal, T5: flow_goaldrop_ring_start}}
  oracle_ft_t300: {mode: teleop, readout: off, model: &ft_t300 {T2: demo_time/flow_goaldrop_disc_large_ft_t300_s0,
                   T3: demo_time/flow_goaldrop_wall_gap_ft_t300_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t300_s0,
                   T5: demo_time/flow_goaldrop_ring_start_ft_t300_s0}}
  oracle_ft_t10800: {mode: teleop, readout: off, model: &ft_t10800 {T2: demo_time/flow_goaldrop_disc_large_ft_t10800_s0,
                     T3: demo_time/flow_goaldrop_wall_gap_ft_t10800_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t10800_s0,
                     T5: demo_time/flow_goaldrop_ring_start_ft_t10800_s0}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_retrained: {mode: policy, model: *retrained}
  policy_ft_t300: {mode: policy, model: *ft_t300}
  policy_ft_t10800: {mode: policy, model: *ft_t10800}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T3: {obstacle: {kind: wall, along: 0.5, gap: 0.16, gap_offset: 0.14, radius: 0.015, extent: 0.4}, adapter: task_wall_gap_n300_s0_with_gain025x}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
    T5: {obstacle: {kind: ring, around: start, gap_angle: [15, 30]}, adapter: task_ring_start_n300_s0_with_curl20}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_ft_t10800
against: [oracle_retrained]
seed: 820
