# The round-2 image task modules' go/no-go, before the grid (all four tasks): grid_task_check_image's
# arms with the task module reading each obstacle token's offset from the cursor (vlm_image, relative token
# geometry, _rel) instead of a
# learned position; one module per task, plus one module pooled over the four tasks (_rel_all),
# and a new row, oracle_ft: the task's fine-tuned policy (flow_goaldrop_<task>_ft_n300_s0, grid_ft's) with no module,
# the bar the image module has to meet. Oracle: the expert_chunk agent in teleop, readout off; policy: the goal-hidden
# policy alone.
# Gate, per context, on oracle_task_rel against oracle_task (the parametric module) and oracle_ft (the fine-tuned
# policy, the floor); hits and collisions are rates over the test trials:
#   pass      hits within 10 points of oracle_task, or above it, and collisions at most oracle_task's + 10 points
#   marginal  more hits than oracle_ft but more than 10 points below oracle_task, collisions within the same +10 bar
#   FAIL      hits at or below oracle_ft's, or collisions more than 10 points over oracle_task's
# (On T5 the parametric module itself hits 74.2%, so "within 10 points" there is 64.2% or better.)
# A goal-hidden policy_task_rel that hits more than 10 points above policy_task is flagged whatever the verdict
# (the module is steering by something other than the obstacles).
#   python run_sweep.py --sweep grid_task_check_image2 --precompute-scene  # fills checkpoints/scene/grid_task_check_image2
#   python run_sweep.py --sweep grid_task_check_image2                     # a few minutes on a free GPU
# The vlm_* tokens need `uv run --extra pi` with CUDA_VISIBLE_DEVICES set and HF_HUB_OFFLINE=1.
name: grid_task_check_image2
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_ft: {mode: teleop, readout: off, model: {T2: flow_goaldrop_disc_large_ft_n300_s0, T3: flow_goaldrop_wall_gap_ft_n300_s0, T4: flow_goaldrop_ring_goal_ft_n300_s0, T5: flow_goaldrop_ring_start_ft_n300_s0}}
  oracle_task_rel: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel, T3: image/task_wall_gap_n300_s0_with_gain025x_vlm_image_rel, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel, T5: image/task_ring_start_n300_s0_with_curl20_vlm_image_rel}}}
  oracle_task_rel_all: {mode: teleop, readout: off, reversal_adapter: {task: image/task_all_n1200_s0_vlm_image_rel}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_task_rel: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel, T3: image/task_wall_gap_n300_s0_with_gain025x_vlm_image_rel, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel, T5: image/task_ring_start_n300_s0_with_curl20_vlm_image_rel}}}
  policy_task_rel_all: {mode: policy, reversal_adapter: {task: image/task_all_n1200_s0_vlm_image_rel}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T3: {obstacle: {kind: wall, along: 0.5, gap: 0.16, gap_offset: 0.14, radius: 0.015, extent: 0.4}, adapter: task_wall_gap_n300_s0_with_gain025x}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
    T5: {obstacle: {kind: ring, around: start, gap_angle: [15, 30]}, adapter: task_ring_start_n300_s0_with_curl20}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_rel
against: [oracle_task, oracle_ft]
seed: 820
