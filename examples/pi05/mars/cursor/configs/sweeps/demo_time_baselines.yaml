# The demonstration-time curve's fine-tuned baselines (Figure 3e, 2026-11-09): demo_time_ft.yaml's cells, budgets, trials
# and seed (the grid's 16 obstacle cells against 0.5, 1, 2, 5, 10, 20, 60 and 180 min of demonstrating; teleop replays the
# grid's trials, the check), each budget's fine-tuned policy (demo_time_ft.yaml's models) under flow control
# (ft_flow_control_t<seconds>, tau tuned) and FRS (ft_frs_t<seconds>, pinned_steps tuned): grid_vision.yaml's two
# fine-tuned baselines, per budget. Fine-tuned + MARS-U per budget stays demo_time_ft.yaml's.
# Plan: docs/superpowers/plans/2026-11-09-mars-fig3-vision-rederivation.md; driver results/research/demo_time_vision/pipeline.sh.
#   python run_sweep.py --sweep demo_time_baselines --cells U1xT2 --out demo_time_baselines_s0_parts/U1xT2   # a part per cell, then --merge
#   python run_sweep.py --sweep demo_time_baselines --module-seed 1 --fixed-settings ../results/sim/sweeps/demo_time_baselines_s0/settings.yaml --out demo_time_baselines_s1
name: demo_time_baselines
agent: expert
arm: condition_grid.yaml
methods:
  teleop: {mode: teleop}
  ft_flow_control_t30:
    mode: flow_control
    model: &ft30 {T2: demo_time/flow_goaldrop_disc_large_ft_t30_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t30_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t30_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t30_s0}
  ft_frs_t30:
    mode: frs
    model: *ft30
  ft_flow_control_t60:
    mode: flow_control
    model: &ft60 {T2: demo_time/flow_goaldrop_disc_large_ft_t60_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t60_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t60_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t60_s0}
  ft_frs_t60:
    mode: frs
    model: *ft60
  ft_flow_control_t120:
    mode: flow_control
    model: &ft120 {T2: demo_time/flow_goaldrop_disc_large_ft_t120_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t120_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t120_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t120_s0}
  ft_frs_t120:
    mode: frs
    model: *ft120
  ft_flow_control_t300:
    mode: flow_control
    model: &ft300 {T2: demo_time/flow_goaldrop_disc_large_ft_t300_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t300_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t300_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t300_s0}
  ft_frs_t300:
    mode: frs
    model: *ft300
  ft_flow_control_t600:
    mode: flow_control
    model: &ft600 {T2: demo_time/flow_goaldrop_disc_large_ft_t600_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t600_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t600_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t600_s0}
  ft_frs_t600:
    mode: frs
    model: *ft600
  ft_flow_control_t1200:
    mode: flow_control
    model: &ft1200 {T2: demo_time/flow_goaldrop_disc_large_ft_t1200_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t1200_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t1200_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t1200_s0}
  ft_frs_t1200:
    mode: frs
    model: *ft1200
  ft_flow_control_t3600:
    mode: flow_control
    model: &ft3600 {T2: demo_time/flow_goaldrop_disc_large_ft_t3600_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t3600_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t3600_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t3600_s0}
  ft_frs_t3600:
    mode: frs
    model: *ft3600
  ft_flow_control_t10800:
    mode: flow_control
    model: &ft10800 {T2: demo_time/flow_goaldrop_disc_large_ft_t10800_s0, T3: demo_time/flow_goaldrop_wall_gap_ft_t10800_s0, T4: demo_time/flow_goaldrop_ring_goal_ft_t10800_s0, T5: demo_time/flow_goaldrop_ring_start_ft_t10800_s0}
  ft_frs_t10800:
    mode: frs
    model: *ft10800
tune:  # the baselines as their papers define them, each with its one knob tuned (grid_vision.yaml's)
  flow_control: {tau: [2, 4, 6, 8, 10, 12, 14, 16]}
  frs: {pinned_steps: [2, 4, 8, 16]}
grid:
  users:
    U1: {corruption: {scale: [1.0, 0.25]}, adapter: user_gain025y_expert_n100_s0}
    U2: {corruption: {scale: [0.25, 1.0]}, adapter: user_gain025x_expert_n100_s0}
    U3: {corruption: {rotation_deg: 60}, adapter: user_rot60_expert_n100_s0}
    U4: {corruption: {curl: 20, tau: 0.1}, adapter: user_curl20_expert_n100_s0}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: null}
    T3: {obstacle: {kind: wall, along: 0.5, gap: 0.16, gap_offset: 0.14, radius: 0.015, extent: 0.4}, adapter: null}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: null}
    T5: {obstacle: {kind: ring, around: start, gap_angle: [15, 30]}, adapter: null}
  noises: [1.0]
  train: [[U1, T2], [U2, T3], [U3, T4], [U4, T5]]
trials: {tune: 200, test: 500}
focus: ft_frs_t300
against: [teleop]
seed: 800
