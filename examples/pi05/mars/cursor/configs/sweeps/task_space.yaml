# The task parameter space search: where does MARS lead teleop, flow control and FRS the
# most? The channel is the study's gain diag(1, 0.25) at input noise 1.0-1.5 (the lead levels off
# from 1.0 up, see study_condition); the task axes vary the ambiguity of the layouts (number of
# targets, their spacing), the reach distance and the selection dwell. A screen: fewer trials and
# depths than the study_condition sweep; the top cells get the full protocol afterwards. Cells that
# cannot be laid out (12 targets 0.24 apart) are skipped. ranking.csv lists every cell, best lead first.
#   python run_sweep.py --sweep task_space            # ~3 h on one RTX 6000 Ada; --resume continues it
name: task_space
agent: expert
arm: base.yaml
methods:
  teleop: {mode: teleop}
  flow_control: {mode: flow_control}
  frs: {mode: frs}
  mars: {mode: frs, reversal_adapter: {learned: gain025y_free}}
depths:
  flow_control: [2, 4, 8, 12, 16]   # chunk steps (of 16) that carry the command
  frs: [1, 2, 3, 4, 6, 8, 10]   # steps reversed (of 10)
grid:
  family: gain
  levels: [0.25]
  noises: [1.0, 1.25, 1.5]
  axes:                                   # every combination, with every noise
    targets: [[2, 2], [4, 4], [8, 8], [12, 12]]
    min_target_sep: [0.10, 0.12, 0.16, 0.24]
    reach: [[0.2, 0.35], [0.35, 0.5], [0.5, 0.75]]
    dwell_s: [0.3, 0.5]
trials: {tune: 100, test: 200}
focus: mars
against: [teleop, flow_control, frs]
seed: 400
