# Kao et al.'s flow control at the study condition: the command's scale in the noise prior (ic_gain) x tau, beside
# teleop and the study's own setting (the command in action units, ic_gain 2.0843, lambda 1 and 2). Chooses ic_gain
# once, for every arm (base.yaml), as Kao et al. chose their gain; tau stays tuned per cell in every sweep.
#   python run_sweep.py --sweep flow_control_gain
name: flow_control_gain
agent: expert
arm: base.yaml
methods:
  teleop: {mode: teleop}
  flow_control_g05: {mode: flow_control, ic_gain: 0.5}
  flow_control_g1: {mode: flow_control, ic_gain: 1.0}
  flow_control_g2: {mode: flow_control, ic_gain: 2.0}
  flow_control_g3: {mode: flow_control, ic_gain: 3.0}
  flow_control_g5: {mode: flow_control, ic_gain: 5.0}
  flow_control_g8: {mode: flow_control, ic_gain: 8.0}
  flow_control_action: {mode: flow_control, ic_gain: 2.0843}             # the study's scale (action units), lambda 1
  flow_control_action_lambda2: {mode: flow_control, ic_gain: 2.0843, lambda: 2}
depths:
  flow_control: [2, 4, 8, 12, 16]
grid:
  family: gain
  levels: [0.25]
  noises: [1.0]
trials: {tune: 200, test: 500}
focus: flow_control_g2
against: [teleop, flow_control_action]
seed: 300
