# The image task modules' go/no-go, before the grid: grid_task_check's arms with the task module reading the
# obstacles from the rendered scene instead of the disc parameters (token_source vlm_image: pi0.5's frozen vision
# tokens; cnn: a small encoder trained with the module), one module per task (_vlm, _cnn) or one pooled over the four
# (_all). Oracle: the expert_chunk agent in teleop, readout off; policy: the goal-hidden policy alone.
# Gate, per context: oracle_task_<x> hits >= 80% and its collision rate is at most oracle_task's + 10 points; a
# goal-hidden policy_task_<x> that hits more than 10 points above policy_task is flagged (the module is steering by
# something other than the obstacles).
#   python run_sweep.py --sweep grid_task_check_image --precompute-scene   # fills checkpoints/scene/grid_task_check_image
#   python run_sweep.py --sweep grid_task_check_image                      # a few minutes on a free GPU
# The vlm_* tokens need `uv run --extra pi` with CUDA_VISIBLE_DEVICES set and HF_HUB_OFFLINE=1.
name: grid_task_check_image
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_task_vlm: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image, T3: image/task_wall_gap_n300_s0_with_gain025x_vlm_image, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image, T5: image/task_ring_start_n300_s0_with_curl20_vlm_image}}}
  oracle_task_vlm_all: {mode: teleop, readout: off, reversal_adapter: {task: image/task_all_n1200_s0_vlm_image}}
  oracle_task_cnn: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_cnn, T3: image/task_wall_gap_n300_s0_with_gain025x_cnn, T4: image/task_ring_goal_n300_s0_with_rot60_cnn, T5: image/task_ring_start_n300_s0_with_curl20_cnn}}}
  oracle_task_cnn_all: {mode: teleop, readout: off, reversal_adapter: {task: image/task_all_n1200_s0_cnn}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_task_vlm: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image, T3: image/task_wall_gap_n300_s0_with_gain025x_vlm_image, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image, T5: image/task_ring_start_n300_s0_with_curl20_vlm_image}}}
  policy_task_vlm_all: {mode: policy, reversal_adapter: {task: image/task_all_n1200_s0_vlm_image}}
  policy_task_cnn: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_cnn, T3: image/task_wall_gap_n300_s0_with_gain025x_cnn, T4: image/task_ring_goal_n300_s0_with_rot60_cnn, T5: image/task_ring_start_n300_s0_with_curl20_cnn}}}
  policy_task_cnn_all: {mode: policy, reversal_adapter: {task: image/task_all_n1200_s0_cnn}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T3: {obstacle: {kind: wall, along: 0.5, gap: 0.16, gap_offset: 0.14, radius: 0.015, extent: 0.4}, adapter: task_wall_gap_n300_s0_with_gain025x}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
    T5: {obstacle: {kind: ring, around: start, gap_angle: [15, 30]}, adapter: task_ring_start_n300_s0_with_curl20}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_vlm
against: [oracle_task]
seed: 820
