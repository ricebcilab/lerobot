    U3: {corruption: {rotation_deg: 60}, adapter: user_rot60_expert_n100_s0}
    U4: {corruption: {curl: 20, tau: 0.1}, adapter: user_curl20_expert_n100_s0}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: null}
    T3: {obstacle: {kind: wall, along: 0.5, gap: 0.16, gap_offset: 0.14, radius: 0.015, extent: 0.4}, adapter: null}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: null}
    T5: {obstacle: {kind: ring, around: start, gap_angle: [15, 30]}, adapter: null}
  noises: [1.0]
  train: [[U1, T2], [U2, T3], [U3, T4], [U4, T5]]
trials: {tune: 200, test: 500}
focus: ft_mars_user_t300
against: [teleop]
seed: 800
