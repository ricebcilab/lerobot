# The demonstration-time curve: success on the grid's 16 obstacle cells (users U1-U4 x tasks T2-T5 at noise 1.0, the
# grid's cells, trials and seed, so every method here plays the trials it would in configs/sweeps/grid.yaml) against
# the time spent demonstrating the task: 0.5, 1, 2, 5, 10, 20, 60 and 180 min (_t<seconds>), each task given as many
# demonstrations as fit (train_adapter.py / train_policy.py --demo-seconds; the two draw the same demonstrations for one
# budget and seed). teleop replays the grid's, a check that the trials are the grid's. Every steered method is tuned as
# the grid's MARS variants are, over the reversal depth x the pinned prefix (16 = the whole chunk).
# This file: the frozen policy fine-tuned on each budget's demonstrations (train_policy.py --init flow_goaldrop, an
# obstacle head added; its training length picked by train_policy.py --eval_steps), steered through a user module refitted
# on it from the same 100 open-field demonstrations as the grid's (MARS-U on the fine-tuned policy). Its partner
# demo_time_mars.yaml has MARS on the same demonstrations.
#   python run_sweep.py --sweep demo_time_ft --cells U1xT2 --out demo_time_ft_s0_parts/U1xT2   # a part per cell, in parallel, then:
#   python run_sweep.py --sweep demo_time_ft --merge demo_time_ft_s0_parts/U1xT2 ... --out demo_time_ft_s0
#   python run_sweep.py --sweep demo_time_ft --module-seed 1 --fixed-settings ../results/sim/sweeps/demo_time_ft_s0/settings.yaml --out demo_time_ft_s1
