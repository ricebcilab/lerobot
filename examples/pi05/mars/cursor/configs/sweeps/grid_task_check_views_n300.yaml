# Stage B of the two-view image modules, demonstration scan (T2 and T4), count 300: the task module read from two views per
# frame, one per task, trained on 300 demonstrations, against the parametric module (oracle_task, the reference) and the
# fine-tuned policy (oracle_ft). Oracle: the expert_chunk agent in teleop, readout off; policy: the goal-hidden policy.
# Rule, per context: level = hits at least oracle_task's minus 3 points and collisions at most oracle_task's plus 3 points;
# the scan reports the first count that is level and where the log-linear curve crosses the reference.
# A goal-hidden policy_task_views_n300 that hits more than 10 points above policy_task is flagged.
# Report: report_grid_image.py --scan <run300> <run1000> <run3000>.
#   python run_sweep.py --sweep grid_task_check_views_n300
name: grid_task_check_views_n300
agent: expert_chunk
arm: condition_grid.yaml
methods:
  oracle: {mode: teleop, readout: off}
  oracle_task: {mode: teleop, readout: off, reversal_adapter: {task: cell}}
  oracle_ft: {mode: teleop, readout: off, model: {T2: flow_goaldrop_disc_large_ft_n300_s0, T4: flow_goaldrop_ring_goal_ft_n300_s0}}
  oracle_task_views_n300: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_views, T4: image/task_ring_goal_n300_s0_with_rot60_views}}}
  oracle_task_rel: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel}}}
  oracle_task_teach_rel: {mode: teleop, readout: off, reversal_adapter: {task: {T2: image/task_disc_large_n10000_s0_with_gain025y_vlm_image_teacher_rel, T4: image/task_ring_goal_n10000_s0_with_rot60_vlm_image_teacher_rel}}}
  policy: {mode: policy}
  policy_task: {mode: policy, reversal_adapter: {task: cell}}
  policy_task_views_n300: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_views, T4: image/task_ring_goal_n300_s0_with_rot60_views}}}
  policy_task_rel: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n300_s0_with_gain025y_vlm_image_rel, T4: image/task_ring_goal_n300_s0_with_rot60_vlm_image_rel}}}
  policy_task_teach_rel: {mode: policy, reversal_adapter: {task: {T2: image/task_disc_large_n10000_s0_with_gain025y_vlm_image_teacher_rel, T4: image/task_ring_goal_n10000_s0_with_rot60_vlm_image_teacher_rel}}}
tune: {frs: {n_reverse_steps: [10]}}
grid:
  users:
    U0: {corruption: null, adapter: null}
  tasks:
    T2: {obstacle: {kind: disc, radius: 0.08, along: 0.5, offset: [0.012, 0.024]}, adapter: task_disc_large_n300_s0_with_gain025y}
    T4: {obstacle: {kind: ring, around: goal, gap_angle: [15, 30]}, adapter: task_ring_goal_n300_s0_with_rot60}
  noises: [0.0]
trials: {tune: 20, test: 500}
focus: oracle_task_views_n300
against: [oracle_task, oracle_ft]
seed: 820
