# Study arm: MARS with the grid's 100-demonstration user module (expert labels, frozen noise; trained by
#   python train/train_adapter.py --kind user --corruption '{scale: [1.0, 0.25]}' --n-demos 100 --steps 500
#       --frozen-noise --name user_gain025y_expert_n100_s0
# ) at the settings sweeps/study_tuning.yaml tuned (reversal depth x pinned prefix; 85.4% of 500 test trials). The
# recorded sessions ran learned_adapter/gain025y_free at depth 8 over the whole chunk; their records keep it.
extends: condition_study.yaml
control:
  mode: frs
  n_reverse_steps: 5
  pinned_steps: 8
  reversal_adapter: {learned: user_gain025y_expert_n100_s0}
