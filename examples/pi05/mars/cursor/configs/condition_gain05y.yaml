# The known corruption shared by the *_gain05y arms: a per-axis gain on the command
# plus Gaussian noise. What the controller gets is M @ what was pushed
# + N(0, input_noise^2) per axis, with M = diag(scale): here a vertical push
# arrives at half strength. Both apply only while pushing. Change them here
# and every *_gain05y arm follows.
#
# With the expert agent at these values (run_sweep.py --sweep gain, test trials,
# each method at its tuned depth) teleop succeeds on 95% of trials, flow control
# 97%, FRS 92%, MARS 91%. Bringing teleop below ~65% takes input_noise >= 1.5
# at this gain, or a vertical gain <= 0.25 (see results/sim/sweeps/gain/).
extends: base.yaml
control:
  corruption: {scale: [1.0, 0.5]}
  input_noise: 0.75
