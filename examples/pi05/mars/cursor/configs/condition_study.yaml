# User-study condition (2026-10-16), from the task parameter search (run_sweep.py --sweep task_space,
# then task_space_refine): the channel of the earlier study_condition sweep, gain diag(1, 0.25), at
# input noise 1.0, on the task where MARS leads teleop, flow control and FRS the most with
# every method's depth tuned: 4 targets per trial and a reach of 0.35-0.5 from the start to the goal.
# Test trials (500, new seed): MARS 85.6%, flow control 73.0%, teleop 67.4%, FRS 55.8%;
# lead +12.6 points [95% CI +8.4, +16.8] over flow control (+18.2 over teleop, +29.8 over FRS).
# The four study_* arms extend this file at the depths from that sweep's depths.yaml (cell
# 0.25|1.0|targets=4-4|reach=0.35-0.5|dwell_s=0.3). Before 2026-10-16 the study ran at noise 1.25 with
# 2-8 targets and any reach >= 0.2 (lead +7.6 [+2.2, +13.0]; results/old/sim/study_s1 is that condition).
extends: base.yaml
control:
  corruption: {scale: [1.0, 0.25]}
  input_noise: 1.0
task:
  targets: [4, 4]
  reach: [0.35, 0.5]
