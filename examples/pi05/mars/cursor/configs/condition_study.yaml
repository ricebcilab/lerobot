# User-study condition (2026-10-16): gain diag(1, 0.25) at input noise 1.0, 4 targets per trial and a reach of
# 0.35-0.5 from the start to the goal, chosen by a task parameter search (now under results/old/) as where the
# methods differ most. The four study_* arms extend this file at the settings sweeps/study_tuning.yaml tunes.
extends: base.yaml
control:
  corruption: {scale: [1.0, 0.25]}
  input_noise: 1.0
task:
  targets: [4, 4]
  reach: [0.35, 0.5]
