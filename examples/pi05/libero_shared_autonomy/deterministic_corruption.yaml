# Deterministic corruption of the teleop command for interactive.py
# (`--deterministic-corruption [PATH]` or `corruption <PATH>` in the REPL).
#
# M is a 3x3 matrix applied to the SpaceMouse/keyboard translation command at
# every control step:  [dx, dy, dz] -> M @ [dx, dy, dz]
# Rows are output axes, columns are input axes (env action units, +-1 range).
#
# Whichever rows are uncommented below are the ones applied. Two are kept
# here: the identity (an exact no-op -- your command passes through untouched)
# and a rotation of the commanded direction by 30 degrees about z.
M:
  # - [1, 0, 0]
  # - [0, 1, 0]
  # - [0, 0, 1]
  - [0.939, -0.342, 0.0]
  - [0.342, 0.939, 0.0]
  - [0.0, 0.0, 1.0]
