# Settings for interactive.py (`run.sh interactive --config [PATH]`). Every key mirrors a
# command-line flag, which still wins; null keeps the built-in default; unknown keys are rejected.

policy:
  path: lerobot/pi05_libero_finetuned
  n_action_steps: 10
  compile: false

scene:
  suite: libero_spatial       # libero_spatial | libero_object | libero_goal | libero_10 | libero_90 | libero_100
  task_id: 0

control:
  mode: policy                # policy | teleop | shared_override | shared_flow_control | shared_flow_reversal_steering
  n_guided_steps: 5           # FC: denoising steps your command is written into
  n_reversal_steps: null      # FRS: steps the reference is reversed through; null = all the way to noise
  input_noise: 0.0            # std of the noise added to your command (0 = off)
  input_gain: auto            # scale your command so the corruption cannot clip it (null = off)
  corruption: null            # the robot gets M @ your command, e.g. {rotation_z_deg: 20}
  reversal_adapter: null      # FRS-RA, e.g. {translation: corruption, orientation: zero, gripper: zero}

server:
  port: 8765

output_dir: outputs/pi05_libero_interactive
